---
- name: Reload systemd user daemon
  become: true
  become_user: "{{ pihole_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ pihole_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Handle Pi-hole changes
  ansible.builtin.include_tasks: pihole_changes.yml

- name: Handle Caddy changes
  ansible.builtin.include_tasks: caddy_changes.yml
