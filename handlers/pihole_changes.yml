---
- name: Reload systemd user daemon
  become: true
  become_user: "{{ pihole_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ pihole_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Enable and restart Pi-hole (rootless)
  become: true
  become_user: "{{ pihole_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ pihole_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: pihole.service
    enabled: true
    state: restarted
    scope: user
